name: Build Nuke NAS Raspberry Pi IMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'nuke-nas-img.zip'
      - '.github/workflows/build-nuke-nas-img.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          set -euxo pipefail
          rm -rf project
          mkdir project
          unzip -q nuke-nas-img.zip -d project
          PROJECT_DIR=$(find project -type f -name pigen-config -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          echo "PIGEN_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-static debootstrap zerofree zip dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod
          sudo modprobe binfmt_misc || true
          sudo update-binfmts --enable || true

      - name: Clone Pi-gen
        run: git clone --depth 1 https://github.com/RPi-Distro/pi-gen.git pigen

      - name: Install Nuke NAS configuration
        run: |
          set -euxo pipefail
          cp "$PIGEN_PROJECT/pigen-config" pigen/config
          cp -a "$PIGEN_PROJECT/stage-nuke" pigen/
          if [ -f "$PIGEN_PROJECT/EXPORT_IMAGE" ]; then cp "$PIGEN_PROJECT/EXPORT_IMAGE" pigen/; fi
          if [ -f "$PIGEN_PROJECT/prerun.sh" ]; then cp "$PIGEN_PROJECT/prerun.sh" pigen/; chmod +x pigen/prerun.sh; fi
          if grep -q '^IMG_NAME=' pigen/config; then sed -i 's/^IMG_NAME=.*/IMG_NAME=uwu21-rpi/' pigen/config; else printf '\nIMG_NAME=uwu21-rpi\n' >> pigen/config; fi
          if ! grep -q '^DEPLOY_COMPRESSION=' pigen/config; then printf '\nDEPLOY_COMPRESSION=xz\n' >> pigen/config; fi
          test -f pigen/config
          test -d pigen/stage-nuke

      - name: Validate Pi-gen configuration
        run: |
          set -euxo pipefail
          cd pigen
          bash -n build.sh
          find stage-nuke -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do bash -n "$f"; done

      - name: Build with Pi-gen
        run: |
          set -euxo pipefail
          cd pigen
          sudo -E ./build.sh

      - name: Collect image
        run: |
          set -euxo pipefail
          mkdir -p out
          IMG=$(find pigen/deploy -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.xz' \) | head -1)
          test -n "$IMG"
          if [[ "$IMG" == *.xz ]]; then cp "$IMG" out/uwu21-rpi.img.xz; else xz -T0 -9 -c "$IMG" > out/uwu21-rpi.img.xz; fi
          ls -lh out/uwu21-rpi.img.xz

      - name: Upload IMG
        uses: actions/upload-artifact@v4
        with:
          name: uwu21-rpi-image
          path: out/uwu21-rpi.img.xz
          retention-days: 14
