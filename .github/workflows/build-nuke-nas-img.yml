name: Build Nuke NAS Raspberry Pi IMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'nuke-nas-img.zip'
      - '.github/workflows/build-nuke-nas-img.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -euxo pipefail
          rm -rf project
          mkdir project
          unzip -q nuke-nas-img.zip -d project
          PROJECT_DIR=$(find project -type f -name pigen-config -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          echo "PIGEN_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git quilt parted qemu-user-static debootstrap zerofree zip dosfstools libarchive-tools libcap2-bin rsync xz-utils kpartx

      - name: Clone Pi-gen
        run: git clone --depth 1 https://github.com/RPi-Distro/pi-gen.git pigen

      - name: Install project into Pi-gen
        run: |
          set -euxo pipefail
          cp -a "$PIGEN_PROJECT"/. pigen/
          test -f pigen/config
          # Use the project's own configuration; only set the output name if absent.
          if ! grep -q '^IMG_NAME=' pigen/config; then
            printf '\nIMG_NAME=uwu21-rpi\n' >> pigen/config
          fi
          printf '\nDEPLOY_COMPRESSION=xz\n' >> pigen/config

      - name: Build with Pi-gen
        run: |
          set -euxo pipefail
          cd pigen
          sudo ./build.sh

      - name: Collect image
        run: |
          set -euxo pipefail
          mkdir -p out
          IMG=$(find pigen/deploy -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.xz' \) | head -1)
          test -n "$IMG"
          if [[ "$IMG" == *.xz ]]; then
            cp "$IMG" out/uwu21-rpi.img.xz
          else
            xz -T0 -9 -c "$IMG" > out/uwu21-rpi.img.xz
          fi
          ls -lh out/uwu21-rpi.img.xz

      - name: Upload IMG
        uses: actions/upload-artifact@v4
        with:
          name: uwu21-rpi-image
          path: out/uwu21-rpi.img.xz
          retention-days: 14
